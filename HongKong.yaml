# Fill in proxy-providers.subscription.url before importing.
mixed-port: 7897
allow-lan: false
mode: rule
log-level: info

profile:
  store-selected: true

dns:
  enable: true
  enhanced-mode: fake-ip
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fake-ip-filter:
    - localhost
    - "+.local"
    - "+.lan"
    - "+.home.arpa"

proxy-providers:
  subscription:
    type: http
    url: "https://subscription.example.invalid/clash.yaml"
    path: ./providers/hongkong-subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: PROXY
    type: select
    use:
      - subscription
    empty-fallback: REJECT

rule-providers:
  chatgpt-voice:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/KevinChen222/rule-/main/chatgpt-voice/ChatGPTVoice.list
    path: ./ruleset/chatgpt-voice.list
    interval: 86400

rules:
  # Apple Intelligence
  - "DOMAIN,apple-relay.apple.com,PROXY"
  - "DOMAIN,gspe1-ssl.ls.apple.com,PROXY"

  # ChatGPT
